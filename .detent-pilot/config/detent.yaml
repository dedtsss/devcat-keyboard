schema: 1
tracker:
  kind: github
  github_status_source: label
  repository: dedtsss/devcat-keyboard
  status_label_prefix: "detent:"
  auto_provision: true
  active_states:
    - Todo
    - In Progress
    - Rework
    - Merging
  observed_states:
    - Backlog
    - Human Review
    - Blocked
  terminal_states:
    - Done
    - Cancelled
  state_map:
    Cancelled: Done
  dependency_auto_unblock:
    enabled: false
  blocked_recovery:
    enabled: false
    breaker_cooldown_seconds: 300
  blocker_auto_promote:
    enabled: false
polling:
  interval_ms: 60000
  conditional: true
worker:
  github_token: gh
intake:
  sources: []
workspace:
  root: /home/codex/detent-pilot/catboard-worktrees
  source_root: /home/codex/detent-pilot/catboard
  cache_strategy: isolated
  auto_branch: true
deliverable:
  merge_method: squash
agent:
  max_concurrent_agents: 1
  max_turns: 8
  # Emergency per-session traffic backstop. Cached input is counted repeatedly,
  # so this is deliberately not the primary no-progress signal. Do not derive a
  # smaller ceiling from the live context window: multi-turn cached traffic can
  # exceed several context-window multiples while useful work is still advancing.
  max_session_tokens: 1500000
  max_session_duration_ms: 1800000
  # Cross-session progress brake. Detent resets this window on accepted PR/head,
  # mergeability, or red->green CI progress.
  no_progress_token_limit: 2000000
  no_progress_timeout_ms: 900000
  instructions_by_state:
    Rework: |-
      Treat Rework as a delta repair, not a fresh implementation run. Reuse the
      existing worktree, branch and PR. Start from the current PR/head and the
      exact current CI failure or validator finding. Inspect only the changed
      files and acceptance criteria directly implicated by that failure. Do not
      reread stable project architecture, re-audit an imported/vendor baseline,
      replay the original task history, or re-prove already completed criteria
      without a concrete new reason. Make the smallest repair, run the smallest
      useful host-safe preflight, commit/push the same PR head, report the delta,
      and stop. GitHub/Detent own CI observation and the next lifecycle decision.
  merge_worker_max_duration_ms: 1800000
  max_retry_backoff_ms: 120000
  auto_promote:
    enabled: true
    quiet_seconds: 30
    gate_wait_state: review
    gate_wait_timeout_seconds: 900
    gate_wait_timeout_action: human_review
    source_state: Human Review
    pass_state: Merging
    rework_state: Rework
    rework_limit: 2
    # Keep the stock count-based brake conservative. The primary token brake is
    # progress-based above; do not tighten this until another real task proves it.
    no_progress_limit: 3
  merge_fast_path:
    enabled: true
  skills:
    enabled: false
  followups:
    enabled: false
agents:
  backends:
    - id: codex-code
      kind: codex
      protocol: app-server
      command: codex -c model=gpt-5.6-luna -c model_reasoning_effort=medium -c tool_output_token_limit=5000 -c model_auto_compact_token_limit=96000 app-server
      options:
        approval_policy: never
        thread_sandbox: workspace-write
        turn_sandbox_policy:
          type: workspaceWrite
          networkAccess: true
        turn_timeout_ms: 900000
        read_timeout_ms: 5000
        stall_timeout_ms: 120000
    - id: codex-validator
      kind: codex
      protocol: app-server
      command: codex -c model=gpt-5.6-luna -c model_reasoning_effort=medium -c tool_output_token_limit=5000 -c model_auto_compact_token_limit=96000 app-server
      options:
        approval_policy: never
        thread_sandbox: read-only
        turn_sandbox_policy:
          type: readOnly
        turn_timeout_ms: 600000
        read_timeout_ms: 5000
        stall_timeout_ms: 120000
  routes:
    - name: validator
      role: validator
      backend: codex-validator
    - name: default
      backend: codex-code
      default: true
codex:
  command: codex -c model=gpt-5.6-luna -c model_reasoning_effort=medium -c tool_output_token_limit=5000 -c model_auto_compact_token_limit=96000 app-server
  approval_policy: never
  thread_sandbox: workspace-write
  turn_sandbox_policy:
    type: workspaceWrite
    networkAccess: true
gate:
  kind: command
  run: ./scripts/check.sh
  require_automated_review: false
  required_status_checks:
    - check
  ci_failure_action: rework
  transient_ci_retry_limit: 1
  validator:
    enabled: true
    min_score: 0.8
    max_attempts: 2
    max_inline_diff_bytes: 65536
    block_on:
      - p1
      - p2
server:
  host: 127.0.0.1
  kanban:
    mode: read_only
budget:
  enabled: false
hooks:
  timeout_ms: 30000
