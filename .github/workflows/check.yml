name: check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108"

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh || true

      - name: Run lightweight source preflight
        run: ./scripts/check.sh

      - name: Prepare offline voice runtime
        run: ./scripts/prepare-voice-runtime.sh

      - name: Run Android unit tests
        run: ./scripts/test.sh

      - name: Build CatBoard and cleaner companion debug APKs
        run: ./scripts/build.sh

      - name: Upload alpha debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: catboard-alpha-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/HeliBoard_*-debug.apk
            cleaner-companion/build/outputs/apk/debug/cleaner-companion-debug.apk
          if-no-files-found: error
